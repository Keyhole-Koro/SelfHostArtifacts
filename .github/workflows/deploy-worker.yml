# Deploys the Worker when the publish branch is pushed. Configure once in the repository settings
# (Settings → Secrets and variables → Actions):
#   Secrets:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   Variables: APP_HOST, D1_DATABASE_ID (optional: KEEP_VERSIONS, TRASH_DAYS)
# The Worker's own secrets (session and content keys) stay in Cloudflare and are not touched.
# Without APP_HOST (e.g. in a fork) the deploy job is skipped.
name: Deploy Worker

on:
  push:
    branches: [publish]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    if: vars.APP_HOST != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.APP_HOST }}
    defaults:
      run:
        working-directory: packages/worker
    # The Cloudflare token goes only to the two wrangler steps, not to the actions or the install
    # scripts that run before them.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Write wrangler.local.toml
        run: node scripts/write-config.mjs
        env:
          APP_HOST: ${{ vars.APP_HOST }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          KEEP_VERSIONS: ${{ vars.KEEP_VERSIONS }}
          TRASH_DAYS: ${{ vars.TRASH_DAYS }}
      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply artifacts --remote -c wrangler.local.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy
        run: pnpm exec wrangler deploy -c wrangler.local.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check health
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ vars.APP_HOST }}/health") && [ "$code" = 200 ] && exit 0
            sleep 10
          done
          echo "https://${{ vars.APP_HOST }}/health did not answer 200 after deploying" && exit 1
