# Publishes @keyhole-koro/artifacts to npm when a tag like cli-v0.1.1 is pushed.
#
# Uses npm trusted publishing (OIDC): no npm token is stored anywhere, and the package gets a
# provenance attestation. Set it up once on npmjs.com → the package → Settings → Trusted
# publishing → GitHub Actions: this repository, workflow file "publish-cli.yml".
#
# To release: bump "version" in packages/cli/package.json, commit, then
#   git tag cli-v<version> && git push origin cli-v<version>
name: Publish CLI

on:
  push:
    tags: ["cli-v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs npm 11.5.1 or later, which ships with Node 24.
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "cli-v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" && exit 1
          fi
      - run: npm publish --access public
