# Development defaults. For a real deployment, `pnpm run deploy` (scripts/deploy.mjs) writes
# wrangler.local.toml (git-ignored) with your hostname and resource ids, and deploys with it.
name = "artifacts"
main = "src/index.ts"
compatibility_date = "2026-08-15"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_HOST = "localhost:8787"
KEEP_VERSIONS = "0"
TRASH_DAYS = "30"
# Skips sign-in and signs in as the owner. Refused unless APP_HOST is localhost.
DEV_LOGIN = "true"

[[d1_databases]]
binding = "DB"
database_name = "artifacts"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BLOBS"
bucket_name = "artifacts-blobs"

[[ratelimits]]
name = "PAIR_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[triggers]
crons = ["17 3 * * *"]
